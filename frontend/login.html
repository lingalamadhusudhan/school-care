<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Login - School Management System
</title>

<link rel="stylesheet"
      href="css/style.css">

</head>


<body class="login-body">

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            S
        </div>

        <h1>
            School Login
        </h1>

        <p class="login-subtitle">
            Login as Admin, Teacher or Parent
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary full-width">

                Login

            </button>

        </form>


        <p id="loginMessage"
           class="error-message">
        </p>


        <div class="demo-login">

            <h3>Development Accounts</h3>

            <p>
                Admin:
                admin@school.com /
                admin123
            </p>

            <p>
                Teacher:
                teacher@school.com /
                teacher123
            </p>

            <p>
                Parent:
                parent@school.com /
                parent123
            </p>

        </div>

        <a href="index.html"
           class="back-link">

            ← Back to Home

        </a>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
